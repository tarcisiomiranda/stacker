version: 1

ui:
  wheel_lines: 3
  copy_on_release: true
  max_log_lines: 10000
  word_wrap: false  # initial log wrap state; toggle with W (TUI) or the web checkbox
  highlight_errors: false  # opt-in: orange badge on error-looking output lines

processes:
  backend:
    command: mise run back
    cwd: .
    autostart: false
    graceful_timeout: 8s
    # port: 8000   # free this port before start/restart (kills external holders)

  frontend:
    command: mise run front
    cwd: .
    autostart: false
    graceful_timeout: 8s
    # port: 3000

  demo:
    command: 'i=1; while true; do echo "demo log $i - $(date +%T)"; i=$((i+1)); sleep 1; done'
    cwd: .
    autostart: true
    graceful_timeout: 3s
    tasks:  # per-process one-shot: TUI `t`, web More ▾ → Tasks, or `stacker run demo <task>`
      date: date
      list-files: ls -la

# Standalone one-shot tasks: own entry (▶) in the list; run with Enter / web ▶ Run
# / `stacker start <name>`. For commands not tied to a single process.
tasks:
  disk-usage:
    command: df -h
  list-here:
    command: ls -la
    cwd: .
