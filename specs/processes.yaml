last_updated: 2026-09-24

domain: processes
description: Process configuration, lifecycle supervision, grouped terminal UI and web index/log sidebar with horizontal group-header dividers and `−/+` fold markers, implicit `Other` fallback, first-appearance ordering within service/task tiers, persisted web and attach section folding, session group picking with current-group highlighting, full-choice arrow/vi-key navigation, enter selection and digit shortcuts, group-aware mixed service/task ordering, web and control-plane actions (group action results list affected members under `affected`), log capture, CLI control plane, free-port, live YAML reload, serve/attach, and instance disambiguation.

