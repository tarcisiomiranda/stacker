name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          install_args: "go python"
          cache: true
      - run: mise run test
      - run: mise run release:check
      - run: mise run test:installer:windows
      - run: mise run package:windows
      - run: mise run test:windows:smoke
      - uses: actions/upload-artifact@v7
        with:
          name: stacker-windows-local
          path: dist/stacker-windows-amd64.zip
          if-no-files-found: error
