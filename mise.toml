min_version = "2026.7.0"

[tools]
go = "1.24"

[tasks.setup]
description = "Install Go dependencies"
run = "go mod tidy"

[tasks.dev]
description = "Run the TUI using devtui.yml"
depends = ["setup"]
run = "go run ./cmd/devtui -config devtui.yml"

[tasks.build]
description = "Build the local binary"
depends = ["setup"]
run = "mkdir -p bin && go build -trimpath -ldflags='-s -w' -o bin/devtui ./cmd/devtui"

[tasks.install]
description = "Install devtui into GOBIN or GOPATH/bin"
depends = ["setup"]
run = "go install ./cmd/devtui"

[tasks.test]
description = "Run tests"
run = "go test ./..."

[tasks.clean]
description = "Remove generated binaries"
run = "rm -rf bin"
